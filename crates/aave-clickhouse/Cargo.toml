[package]
name = "aave-clickhouse"
description = "The ClickHouse adapters behind the ports `aave` defines"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
aave.workspace = true
clickhouse-client.workspace = true
units.workspace = true

async-trait = "0.1.92"
# `Row`, the encoding a ledger append writes.
serde = { version = "1.0.228", features = ["derive"] }

[dev-dependencies]
# The captured mainnet logs the ledger cases write.
aave = { workspace = true, features = ["fixtures"] }
# The schema `bins/migrate` applies, so a case's ledgers carry the fold's views as deployed.
migrations.workspace = true
serde_json = "1.0.151"
# `#[tokio::test]`; the driver pulls tokio in regardless.
tokio = { version = "1.53.1", features = ["macros", "rt"] }

[lints]
workspace = true
